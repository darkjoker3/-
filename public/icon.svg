<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background with rounded corners (iOS/Android maskable friendly) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle GPS Grid lines in background -->
  <circle cx="256" cy="230" r="170" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3" stroke-dasharray="8 8" />
  <circle cx="256" cy="230" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" />

  <!-- Navigation Pin -->
  <g filter="url(#dropShadow)">
    <path d="M256 90 C180 90, 120 150, 120 226 C120 310, 230 410, 256 430 C282 410, 392 310, 392 226 C392 150, 332 90, 256 90 Z" fill="url(#pinGrad)" />
    <!-- Pin Center Circle -->
    <circle cx="256" cy="224" r="76" fill="#4f46e5" />
    <!-- Ghost Face in center -->
    <path d="M256 180 C234 180, 218 196, 218 218 L218 254 C224 248, 232 254, 238 248 C244 254, 252 248, 256 254 C260 248, 268 254, 274 248 C280 254, 288 248, 294 254 L294 218 C294 196, 278 180, 256 180 Z" fill="#ffffff" />
    <circle cx="242" cy="214" r="5" fill="#4338ca" />
    <circle cx="270" cy="214" r="5" fill="#4338ca" />
    <ellipse cx="256" cy="232" rx="4" ry="6" fill="#4338ca" />
  </g>

  <!-- Route Accent Line -->
  <path d="M160 450 Q 256 420, 352 460" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 12" />
</svg>
